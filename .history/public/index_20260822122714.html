<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Financiero — Roma Automotores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .navbar {
            min-height: 90px;
            background-color: #0B2341;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }
        .navbar-left,
        .navbar-links,
        .navbar-logout {
            display: flex;
            align-items: center;
        }
        .navbar-left {
            gap: 14px;
        }
        .navbar-links {
            gap: 24px;
        }
        .navbar-brand,
        .navbar-link,
        .navbar-logout {
            color: #FFFFFF;
        }
        .navbar-link,
        .navbar-logout {
            background: transparent;
            border: 0;
            cursor: pointer;
        }
        .navbar-logout {
            gap: 6px;
        }
        .navbar-logo {
            width: auto;
            height: 42px;
            display: block;
        }
        .logout-logo {
            width: auto;
            height: 18px;
            display: block;
        }

</style>
</head>
<body>
<div class="navbar">
    <div class="navbar-left">
        <img class="navbar-logo" src="logotiporoma.png" alt="Roma">
        <span class="navbar-brand">AUTOMOTORES</span>
    </div>
    <div class="navbar-links">
        <button class="navbar-link active" type="button">SIMULADOR FINANCIERO</button>
        <button class="navbar-link" type="button" id="panelAdmimBtn">PANEL ADMINISTRATIVO</button>
    </div>
    <button class="navbar-logout" type="button" id="logoutBtn">
        <img class="logout-logo" src="cerrarsesion.png" alt="">
        <span>CERRAR SESIÓN</span>
    </button>
</div>

<div class="app">
    <div class="main-col">
        
    </div>
</div>

</body>
</html>
