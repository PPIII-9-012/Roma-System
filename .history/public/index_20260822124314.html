<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Financiero — Roma Automotores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .navbar {
            height: 90px;
            background: #0B2341;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .navbar-left,
        .navbar-links,
        .navbar-logout {
            display: flex;
            align-items: center;
        }
        .navbar-left {
            gap: 14px;
        }
        .navbar-links {
            gap: 36px;
        }
        .navbar-logo {
            width: auto;
            height: 70px;
            display: block;
        }
        .navbar-brand {
            font-size: 13px;
            opacity: .7;
            letter-spacing: 2px;
            font-weight: 500;
        }
        .navbar-brand,
        .navbar-link,
        .navbar-logout {
            color: #FFFFFF;
        }
        .navbar-link {
            font-size: 14px;
            opacity: .55;
            text-decoration: none;
            padding-bottom: 4px;
            letter-spacing: .2px;
            transition: opacity .15s;
            position: relative;
        }
        .navbar-link:hover {
            opacity: .85;
        }
        .navbar-link.active {
            opacity: 1;
        }
        .navbar-link.active::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -8px;
            height: 2px;
            background: #a52222;
        }
        .navbar-logout {
            font-size: 13px;
            opacity: .6;
        }
        .navbar-logout:hover {
            opacity: 1;
        }
        .navbar-link,
        .navbar-logout {
            background: transparent;
            border: 0;
            cursor: pointer;
        }
        .navbar-logout {
            gap: 6px;
        }
        .logout-logo {
            width: auto;
            height: 18px;
            display: block;
        }
        @media (max-width: 900px) {
            .navbar {
                height: auto;
                min-height: 90px;
                flex-wrap: wrap;
                gap: 14px 20px;
                padding: 14px 24px;
            }
            .navbar-links {
                order: 3;
                width: 100%;
                justify-content: center;
            }
            .navbar-link.active {
                padding-bottom: 4px;
            }
            .navbar-link.active::after {
                bottom: -4px;
            }
        }
        @media (max-width: 560px) {
            .navbar {
                align-items: center;
                padding: 12px 16px;
            }
            .navbar-logo {
                height: 50px;
            }
            .navbar-brand {
                font-size: 11px;
                letter-spacing: 1px;
            }
            .navbar-links {
                gap: 12px;
            }
            .navbar-link {
                font-size: 11px;
                letter-spacing: 0;
                text-align: center;
            }
            .navbar-logout {
                font-size: 11px;
            }
            .logout-logo {
                height: 16px;
            }
        }

</style>
</head>
<body>
<div class="navbar">
    <div class="navbar-left">
        <img class="navbar-logo" src="logotiporoma.png" alt="Roma">
        <span class="navbar-brand">AUTOMOTORES</span>
    </div>
    <div class="navbar-links">
        <button class="navbar-link active" type="button">SIMULADOR FINANCIERO</button>
        <button class="navbar-link" type="button" id="panelAdmimBtn">PANEL ADMINISTRATIVO</button>
    </div>
    <button class="navbar-logout" type="button" id="logoutBtn">
        <img class="logout-logo" src="cerrarsesion.png" alt="">
        <span>CERRAR SESIÓN</span>
    </button>
</div>

<div class="app">
    <div class="main-col">
        
    </div>
</div>

</body>
</html>
