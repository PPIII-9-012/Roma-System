<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Financiero — Roma Automotores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .navbar {
            height: 90px;
            background: #0B2341;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .navbar-left,
        .navbar-links,
        .navbar-logout {
            display: flex;
            align-items: center;
        }
        .navbar-left {
            gap: 14px;
        }
        .navbar-links {
            gap: 36px;
        }
        .navbar-logo {
            width: auto;
            height: 70px;
            display: block;
        }
        .navbar-brand {
            font-size: 13px;
            opacity: .7;
            letter-spacing: 2px;
            font-weight: 500;
        }
        .navbar-brand,
        .navbar-link,
        .navbar-logout {
            color: #FFFFFF;
        }
        .navbar-link {
            font-size: 14px;
            opacity: .55;
            text-decoration: none;
            padding-bottom: 4px;
            letter-spacing: .2px;
            transition: opacity .15s;
            position: relative;
        }
        .navbar-link:hover {
            opacity: .85;
        }
        .navbar-link.active {
            opacity: 1;
        }
        .navbar-link.active::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -10px;
            height: 3px;
            background: #a52222;
        }
        .navbar-logout {
            font-size: 13px;
            opacity: .6;
        }
        .navbar-logout:hover {
            opacity: 1;
        }
        .navbar-link,
        .navbar-logout {
            background: transparent;
            border: 0;
            cursor: pointer;
        }
        .navbar-logout {
            gap: 6px;
        }
        .logout-logo {
            width: auto;
            height: 18px;
            display: block;
        }
        body {
            background: #F1F3F4;
            color: #374151;
        }
        .app {
            display: flex;
            max-width: 1440px;
            margin: 0 auto;
            align-items: flex-start;
        }
        .main-col {
            flex: 1;
            min-width: 0;
            padding: 24px 24px 60px 40px;
        }
        .side-col {
            width: 320px;
            flex-shrink: 0;
            padding: 24px 40px 60px 0;
            position: sticky;
            top: 90px;
        }
        .progress-tabs {
            background: #FFFFFF;
            display: flex;
            border-bottom: 1px solid #9CA3AF;
            margin-bottom: 10px;
        }
        .progress-tab {
            flex: 1;
            min-width: 0;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 5px 8px;
            background: #FFFFFF;
            border: 0;
            border-right: 1px solid #9CA3AF;
            color: #6B7280;
            cursor: pointer;
            font-size: 11px;
        }
        .progress-tab:last-child { border-right: 0; }
        .progress-tab.active { color: #0B2341; font-weight: 600; border-bottom: 2px solid #0B2341; }
        .progress-tab img { height: 22px; width: auto; }
        .form-card, .summary-card {
            background: #FFFFFF;
            border-radius: 6px;
            overflow: hidden;
        }
        .form-section {
            padding: 12px 16px 16px;
            border-bottom: 8px solid #F1F3F4;
        }
        .form-section-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .form-section-num {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #0B2341;
            color: #FFFFFF;
            display: grid;
            place-items: center;
            font-size: 11px;
            font-weight: 700;
        }
        .form-section-title { color: #0B2341; font-size: 13px; font-weight: 700; }
        .field-row, .used-fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
        .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .field label { font-size: 10px; color: #6B7280; }
        .field input, .field select, .search-input {
            width: 100%;
            height: 27px;
            padding: 4px 8px;
            border: 1px solid #9CA3AF;
            border-radius: 5px;
            background: #FFFFFF;
            color: #374151;
            font-size: 10px;
        }
        .used-layout { display: grid; grid-template-columns: 1fr 158px; gap: 12px; align-items: end; }
        .infoauto-box { background: #EFF6FF; border: 1px solid #70A5F8; border-radius: 6px; min-height: 72px; padding: 9px; text-align: center; color: #1D4ED8; font-size: 10px; }
        .infoauto-value { display: block; font-size: 16px; font-weight: 700; margin-top: 3px; }
        .search-wrap { position: relative; margin-bottom: 8px; }
        .new-car-card { display: grid; grid-template-columns: 82px 1fr auto auto; gap: 10px; align-items: center; border: 1px solid #9CA3AF; border-radius: 5px; padding: 7px; }
        .car-photo { width: 82px; height: 50px; object-fit: contain; }
        .car-name { font-size: 12px; font-weight: 700; color: #0B2341; }
        .car-meta, .price-label { font-size: 9px; color: #6B7280; }
        .price-value { font-size: 12px; font-weight: 700; color: #374151; }
        .op-grid { display: grid; grid-template-columns: repeat(3, 1fr) 160px; gap: 12px; align-items: center; }
        .op-label { font-size: 10px; color: #6B7280; }
        .op-value { font-size: 14px; font-weight: 700; }
        .negative { color: #E24B4A; }
        .cash-box { border: 1px solid #639922; border-radius: 5px; padding: 8px; text-align: center; color: #639922; }
        .cash-box strong { display: block; font-size: 16px; }
        .plans-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .plan-card { border: 1px solid #D9D9D9; border-radius: 6px; padding: 10px; min-width: 0; }
        .plan-card:first-child { border-color: #639922; }
        .plan-badge { display: inline-block; background: #639922; color: #FFFFFF; border-radius: 4px; padding: 3px 6px; font-size: 8px; font-weight: 700; }
        .plan-type { color: #6B7280; font-size: 9px; margin-top: 7px; }
        .plan-name { color: #0B2341; font-size: 12px; font-weight: 700; margin: 4px 0 8px; }
        .plan-price { color: #374151; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .plan-row { display: flex; justify-content: space-between; border-top: 1px solid #F1F3F4; padding: 4px 0; font-size: 9px; }
        .plan-row span:first-child { color: #6B7280; }
        .plan-row span:last-child { font-weight: 600; }
        .rci { height: 5px; margin: 7px 0 3px; background: linear-gradient(to right, #639922 50%, #BA7517 50% 83%, #E24B4A 83%); border-radius: 4px; }
        .plan-button { display: block; margin: 8px auto 0; padding: 4px 14px; border: 1px solid #0B2341; background: #FFFFFF; border-radius: 4px; font-size: 9px; }
        .summary-card { border: 1px solid #D9D9D9; }
        .summary-head { background: #0B2341; color: #FFFFFF; padding: 14px; font-size: 13px; font-weight: 700; }
        .summary-body { padding: 12px 14px; }
        .summary-title { color: #6B7280; font-size: 9px; text-transform: uppercase; margin: 8px 0 4px; }
        .summary-row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; font-size: 9px; }
        .summary-row span:last-child { font-weight: 600; text-align: right; }
        .summary-divider { border: 0; border-top: 1px solid #D9D9D9; margin: 8px 0; }
        .summary-cash { border: 1px solid #639922; color: #639922; text-align: center; padding: 6px; margin-top: 8px; font-size: 10px; }
        .summary-cash strong { display: block; font-size: 14px; }
        .side-action { width: 100%; margin-top: 14px; padding: 9px; border: 1px solid #0B2341; border-radius: 5px; background: #FFFFFF; font-size: 10px; }
        .side-action.whatsapp { background: #63B35C; color: #FFFFFF; border: 0; }
        .cliente-logo {
            width: auto;
            height: 20px;
            display: block;
        }
        @media (max-width: 900px) {
            .navbar {
                height: auto;
                min-height: 90px;
                flex-wrap: wrap;
                gap: 14px 20px;
                padding: 14px 24px;
            }
            .navbar-links {
                order: 3;
                width: 100%;
                justify-content: center;
            }
            .navbar-link.active {
                padding-bottom: 4px;
            }
            .navbar-link.active::after {
                bottom: -4px;
            }
            .app { flex-direction: column; }
            .main-col, .side-col { width: 100%; padding: 16px 24px 24px; }
            .side-col { position: static; }
        }
        @media (max-width: 560px) {
            .navbar {
                align-items: center;
                padding: 12px 16px;
            }
            .navbar-logo {
                height: 50px;
            }
            .navbar-brand {
                font-size: 11px;
                letter-spacing: 1px;
            }
            .navbar-links {
                gap: 12px;
            }
            .navbar-link {
                font-size: 11px;
                letter-spacing: 0;
                text-align: center;
            }
            .navbar-logout {
                font-size: 11px;
            }
            .logout-logo {
                height: 16px;
            }
            .main-col, .side-col { padding: 12px 16px 20px; }
            .field-row, .used-fields, .plans-grid { grid-template-columns: 1fr; }
            .used-layout, .op-grid { grid-template-columns: 1fr; }
            .new-car-card { grid-template-columns: 64px 1fr; }
            .car-photo { width: 64px; }
        }

</style>
</head>
<body>
<div class="navbar">
    <div class="navbar-left">
        <img class="navbar-logo" src="logotiporoma.png" alt="Roma">
        <span class="navbar-brand">AUTOMOTORES</span>
    </div>
    <div class="navbar-links">
        <button class="navbar-link active" type="button">SIMULADOR FINANCIERO</button>
        <button class="navbar-link" type="button" id="panelAdmimBtn">PANEL ADMINISTRATIVO</button>
    </div>
    <button class="navbar-logout" type="button" id="logoutBtn">
        <img class="logout-logo" src="cerrarsesion.png" alt="">
        <span>CERRAR SESIÓN</span>
    </button>
</div>

<div class="app">
    <div class="main-col">
    <div class="progress-tabs">
        <button class="progress-tab active" data-target="sec-cliente"><img class="cliente-logo" src="cliente.png" alt=""><span>Cliente</span></button>
        <button class="progress-tab" data-target="sec-usado">🚗<span>Vehículo usado</span></button>
        <button class="progress-tab" data-target="sec-nuevo">🚙<span>Vehículo nuevo</span></button>
        <button class="progress-tab" data-target="sec-opciones">📊<span>Resumen y opciones</span></button>
    </div>
    </div>
</div>

</body>
</html>
